<!DOCTYPE html>
<head>
<title>Club Application Form</title>    
<style>
    body {
        background-color: pink;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    .container {
        width: 400px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }
    label {
        display: block;
        margin-top: 10px;
    }
    input, select, textarea {
        width:100%;
        padding: 5px;
        margin-top: 5px;
    }
    button {
        background-color: rgb(187, 250, 92);
        margin-top: 15px;
        padding: 8px 12px;;
    }
</style>
</head>
<body>

<div class="container">
<form id="signUpForm">
   
        <label>Student ID
            <input type="number" id="studentId" required>
        </label>

        <label>Full Name
            <input type="text" id="fullName" required>
        </label>

        <label>Birthday
            <input type="date" id="birthday" required>
        </label>

        <label>Email address
            <input type="email" id="email" required>
        </label>

        <label>Mobile Number
            <input type="tel" id="mobile" required>
        </label>
 
    
        <label>Grade Level
            <select id="grade" required>
                <option value="G7">Grade 7</option>
                <option value="G8">Grade 8</option>
                <option value="G9">Grade 9</option>
                <option value="G10">Grade 10</option>
                <option value="G11">Grade 11</option>
                <option value="G12">Grade 12</option>
            </select>
        </label>
        <label>Intern/Extern
            <input type="radio" name="type" value="intern" required> Intern
            <input type="radio" name="type" value="extern" required> Extern
        </label>
        <label>Preferred Club
            <select id="club" required>
                <option value="Math">Math Club</option>
                <option value="Art">Art Club</option>
                <option value="Bake">Bake Club</option>
                <option value="Health">Health Club</option>
                <option value="Reading">Reading Club</option>
            </select>
        </label>
        <label>Why do you want to join?
            <textarea id="reason" required></textarea>
        </label>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" onclick="goToView()">View Signups</button>
</form>
</div>
<script>
    document.getElementById("signUpForm").addEventListener("submit", function(event){
        event.preventDefault();

        if(!confirm("Submit this form?"))
            return;

        let signup = {
            id: studentId.value,
            name: fullName.value,
            birthday: birthday.value,
            email: email.value,
            mobile: mobile.value,   
            grade: grade.value,
            type: document.querySelector('input[name="type"]:checked').value,
            club: club.value,
            reason: reason.value
    };

        let signups = localStorage.getItem("clubSignups");

        if (signups)
            signups = JSON.parse(signups);
        else
            signups = [];

        signups.push(signup);
        
        localStorage.setItem("clubSignups", JSON.stringify(signups));
        alert("Signup saved!");
        document.getElementById("signUpForm").reset();     
    })

    function goToView() {
        window.location.href = "viewSignUps.html";
    } 
        
</script>

</body>
</html>
